api_version: ci.tokenspeed.io/v1
name: perf-sglang-qwen3.8-flash-next-nvfp4-agentx-p16
type: perf
workflow_stage: model-test
triggers:
  - slurm
runner:
  labels:
    - slurm-gb300-4gpu
slurm:
  nodes: 1
  gpus_per_node: 4
env:
  CI: "true"
  MODEL_REVISION: fc694b54fb0174e0913e6adf86691ef85a4ead47
install:
  - python3 -m pip install --target /tmp/agentx-bootstrap 'uv==0.11.25'
  - >-
    /tmp/agentx-bootstrap/bin/uv venv --python 3.12 --seed --clear /tmp/agentx-engine &&
    /tmp/agentx-bootstrap/bin/uv pip install --python /tmp/agentx-engine/bin/python
    'sglang==0.5.20' --prerelease=allow
server:
  command: >-
    /tmp/agentx-engine/bin/python -m sglang.launch_server
    --model-path nvidia/Qwen3.8-Flash-Next-NVFP4
    --served-model-name nvidia/Qwen3.8-Flash-Next-NVFP4
    --revision "$MODEL_REVISION"
    --tp-size 4
    --ep-size 4
    --dtype bfloat16
    --kv-cache-dtype bfloat16
    --mamba-ssm-dtype float32
    --no-ple-offload-embedding
    --speculative-algorithm NEXTN
    --speculative-num-steps 3
    --speculative-eagle-topk 1
    --speculative-num-draft-tokens 4
    --speculative-draft-model-revision "$MODEL_REVISION"
    --json-model-override-args '{"index_share_for_mtp_iteration":true}'
    --context-length 262144
    --max-running-requests 256
    --chunked-prefill-size 8192
    --mem-fraction-static 0.90
    --reasoning-parser qwen3
    --host 127.0.0.1
    --port 8000
  ready:
    url: http://127.0.0.1:8000/health
    timeout: 7200
    interval: 10
perf:
  install:
    - >-
      /tmp/agentx-bootstrap/bin/uv venv --python 3.12 --seed --clear /tmp/evalscope-agentx &&
      /tmp/agentx-bootstrap/bin/uv pip install --python /tmp/evalscope-agentx/bin/python
      'evalscope[agentx]==1.12.0'
    - >-
      mkdir -p .ci-artifacts/published/agentx/metadata &&
      printf '%s\n' "$MODEL_REVISION" > .ci-artifacts/published/agentx/metadata/model-revision.txt &&
      /tmp/agentx-engine/bin/python -m pip freeze --all
      > .ci-artifacts/published/agentx/metadata/engine-packages.txt &&
      /tmp/evalscope-agentx/bin/python -m pip freeze --all
      > .ci-artifacts/published/agentx/metadata/evalscope-packages.txt &&
      nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
      > .ci-artifacts/published/agentx/metadata/gpus.csv
  command: >-
    /tmp/evalscope-agentx/bin/python test/ci_system/run_agentx.py
    --parallel 16
    --model nvidia/Qwen3.8-Flash-Next-NVFP4
    --revision "$MODEL_REVISION"
    --engine sglang
    --engine-version 0.5.20
    --num-gpus 4
    --base-url http://127.0.0.1:8000
    --evalscope /tmp/evalscope-agentx/bin/evalscope
    --outputs-dir .ci-artifacts/published/agentx/benchmark
report:
  github_step_summary: true
